[package]
name = "videoclip"
version = "1.0.0"
edition = "2021"
authors = ["PrAtIk"]
description = "AI-Powered Auto Video Clipper using Groq API"

[dependencies]
ffmpeg-next = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "multipart", "blocking"] }
tokio = { version = "1.0", features = ["full"] }
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
chrono = "0.4"

[[bin]]
name = "videoclip"
path = "src/main.rs"
